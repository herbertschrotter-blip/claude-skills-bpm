name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfskript (alle Skills)
        shell: pwsh
        run: ./tools/validate-skills.ps1
      - name: Tests (Python – Hooks, Skill-Log-Auswertung, Einrichtung, Projekt-Generator)
        run: |
          python3 -m unittest discover -s plugins/work-hooks/hooks -p 'test_*.py'
          python3 -m unittest discover -s tools/skill-log -p 'test_*.py'
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 -m unittest discover -s skills/projekt-anlegen/scripts/tests -p 'test_*.py'
          python3 skills/projekt-anlegen/scripts/validate.py
      - name: Syntax der Installationsskripte
        shell: pwsh
        run: |
          sh -n tools/install.sh
          $fail = $false
          foreach ($f in Get-ChildItem tools/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }; $fail = $true }
          }
          # install.ps1 laeuft ueber "irm | iex": nur ASCII, ohne BOM (sonst scheitert schon die erste Zeile)
          $bytes = [IO.File]::ReadAllBytes("$PWD/tools/install.ps1")
          if ($bytes | Where-Object { $_ -gt 127 }) { Write-Error 'install.ps1 enthaelt Nicht-ASCII-Zeichen oder eine BOM'; $fail = $true }
          if ($fail) { exit 1 }
